# ~/.config/tmux/tmux.conf — cấu hình tmux (version 3.5+), tối ưu cho Neovim
# Được version-control trong repo coding-neovim. Symlink:
#   ln -s ~/develop/coding-neovim/tmux/tmux.conf ~/.config/tmux/tmux.conf

# ============================================================
# Cơ bản
# ============================================================
# Prefix: giữ C-t (thói quen cũ). Đổi ở đây nếu muốn.
unbind C-b
set -g prefix C-t
bind C-t send-prefix

set -g mouse on                    # bật chuột (resize, chọn pane, scroll)
set -g base-index 1                # window bắt đầu từ 1
setw -g pane-base-index 1          # pane bắt đầu từ 1
set -g renumber-windows on         # đánh số lại window khi đóng bớt
set -g history-limit 50000         # scrollback dài
set -g display-time 2000           # thông báo hiện 2s
setw -g mode-keys vi               # copy-mode kiểu vim

# ============================================================
# QUAN TRỌNG cho Neovim
# ============================================================
# Màu chuẩn (true color) + undercurl -> colorscheme & diagnostic đẹp
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:RGB"

# Bỏ độ trễ khi nhấn Esc -> Neovim phản hồi tức thì (thoát insert không giật)
set -sg escape-time 10

# Chuyển tiếp sự kiện focus -> Neovim autoread (file do AI CLI sửa tự nạp lại)
set -g focus-events on

# ============================================================
# vim-tmux-navigator: nhảy Ctrl-h/j/k/l giữa Neovim split và tmux pane
#   (phía Neovim: plugin christoomey/vim-tmux-navigator trong lua/plugins/tmux.lua)
# ============================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# Trong copy-mode vẫn nhảy pane được
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# ============================================================
# Split & window: mở ở ĐÚNG thư mục hiện tại (tiện chuyển BE/FE/job)
# ============================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize pane (giữ prefix + h/j/k/l, lặp được nhờ -r)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z          # phóng to/thu nhỏ pane (zoom)

# Nạp lại config nhanh
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded!"

# ============================================================
# Sessionizer: nhảy nhanh giữa các project/session (BE / FE / job)
#   prefix + f  -> fzf chọn thư mục project -> tạo/switch session
#   prefix + s  -> danh sách session đang có (built-in)
# ============================================================
bind f run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"
bind-key -n 'C-f' run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"

# ============================================================
# Clipboard (cross-OS, KHÔNG cần reattach-to-user-namespace nữa)
# ============================================================
set -g set-clipboard on
# copy-mode kiểu vim: v bắt đầu chọn, y copy, giữ chuột không thoát copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# ============================================================
# Status bar — tối giản, gọn nhẹ (không dùng theme plugin nặng)
# ============================================================
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=black,bg=cyan,bold] #S #[bg=default] "
set -g status-left-length 30
set -g status-right "#[fg=cyan]#{?client_prefix,⌨ ,}#[fg=white]%H:%M #[fg=black,bg=cyan,bold] #h "
set -g status-right-length 40
setw -g window-status-current-format "#[fg=black,bg=white,bold] #I:#W "
setw -g window-status-format "#[fg=white] #I:#W "
set -g pane-active-border-style "fg=cyan"
set -g pane-border-style "fg=brightblack"

# ============================================================
# TPM (tmux plugin manager) — giữ ở CUỐI file
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # bắt buộc cho Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect'      # lưu/khôi phục session
set -g @plugin 'tmux-plugins/tmux-continuum'      # tự lưu session định kỳ

# Session persistence: tự khôi phục khi mở tmux, lưu mỗi 15 phút
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
